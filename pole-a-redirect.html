<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pole A</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: -apple-system, sans-serif;
    color: #888;
    font-size: 14px;
  }
</style>
</head>
<body>
  Doorverwijzen&hellip;
<script>
  var COUNTER_KEY = 'gil_pole_a_taps_7f3q';
  var DESTINATION = 'https://www.brik.be/nl';
  var HOLD_MS = 5000;

  function hitCounter(key) {
    var url = 'https://countapi.mileshilliard.com/api/v1/hit/' + key
      + '?cb=' + Date.now() + Math.random().toString(36).slice(2);
    return fetch(url, {
      keepalive: true,
      cache: 'no-store'
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      if (!data || data.value === undefined) throw new Error('bad response');
      return data;
    });
  }

  function setStatus(text) {
    document.body.textContent = text;
  }

  var startTime = Date.now();

  hitCounter(COUNTER_KEY).then(function (data) {
    setStatus('Teller bijgewerkt: ' + data.value + '. Doorverwijzen over 5 sec\u2026');
  }).catch(function (err) {
    setStatus('Fout: ' + err.message + '. Ga toch door over 5 sec\u2026');
  }).finally(function () {
    var elapsed = Date.now() - startTime;
    var remaining = Math.max(0, HOLD_MS - elapsed);
    setTimeout(function () {
      window.location.replace(DESTINATION);
    }, remaining);
  });
</script>
</body>
</html>
