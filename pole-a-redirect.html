<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pole A</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: -apple-system, sans-serif;
    color: #888;
    font-size: 14px;
  }
</style>
</head>
<body>
  Doorverwijzen&hellip;
<script>
  var COUNTER_KEY = 'gil_pole_a_taps_7f3q';
  var DESTINATION = 'https://www.brik.be/nl';
  var TIMEOUT_MS = 5000;
  var settled = false;

  function hitCounter(key) {
    return fetch('https://countapi.mileshilliard.com/api/v1/hit/' + key, {
      keepalive: true
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      if (!data || data.value === undefined) throw new Error('bad response');
      return data;
    });
  }

  function showError(code) {
    settled = true;
    document.body.textContent = 'Fout ' + code + ' \u2014 teller kon niet worden bijgewerkt.';
  }

  var timer = setTimeout(function () {
    if (!settled) showError('TIMEOUT');
  }, TIMEOUT_MS);

  hitCounter(COUNTER_KEY).then(function () {
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    window.location.replace(DESTINATION);
  }).catch(function () {
    if (settled) return;
    clearTimeout(timer);
    showError('NETWORK');
  });
</script>
</body>
</html>
