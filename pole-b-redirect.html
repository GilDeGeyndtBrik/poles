<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pole B</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: -apple-system, sans-serif;
    color: #888;
    font-size: 14px;
  }
</style>
</head>
<body>
  Doorverwijzen&hellip;
<script>
  var COUNTER_KEY = 'gil_pole_b_taps_7f3q';
  var DESTINATION = 'https://www.brik.be/nl';
  var GUARD_KEY = 'pole_b_hit_guard';
  var GUARD_WINDOW_MS = 4000;

  function hitCounter(key) {
    var url = 'https://countapi.mileshilliard.com/api/v1/hit/' + key
      + '?cb=' + Date.now() + Math.random().toString(36).slice(2);
    return fetch(url, {
      keepalive: true,
      cache: 'no-store'
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      if (!data || data.value === undefined) throw new Error('bad response');
      return data;
    });
  }

  function alreadyCountedRecently() {
    try {
      // localStorage (not sessionStorage) so the guard is shared across tabs:
      // browsers that speculatively preload/prerender a typed-in URL (e.g.
      // Safari's "Preload Top Hit", Chrome's address-bar prerendering) can run
      // this script once in a hidden tab and once in the real one. sessionStorage
      // is per-tab and misses that; localStorage is shared per-origin.
      var last = localStorage.getItem(GUARD_KEY);
      if (last && (Date.now() - parseInt(last, 10)) < GUARD_WINDOW_MS) return true;
      localStorage.setItem(GUARD_KEY, String(Date.now()));
      return false;
    } catch (e) {
      return false;
    }
  }

  function runTap() {
    if (alreadyCountedRecently()) {
      console.log('[pole-b] duplicate load detected, skipping extra count');
      window.location.replace(DESTINATION);
    } else {
      hitCounter(COUNTER_KEY).then(function (data) {
        console.log('[pole-b] counter updated, new value: ' + data.value);
      }).catch(function (err) {
        console.error('[pole-b] counter update failed: ' + err.message);
      }).finally(function () {
        window.location.replace(DESTINATION);
      });
    }
  }

  if (document.prerendering) {
    // Speculatively pre-rendered in the background (address-bar prediction /
    // link preview). Don't count or redirect until it's actually activated as
    // the visible page, otherwise a background preload alone counts as a tap.
    document.addEventListener('prerenderingchange', runTap, { once: true });
  } else {
    runTap();
  }
</script>
</body>
</html>
